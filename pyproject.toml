[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurochat"
version = "0.1.0"
description = "Ask questions of a brain volume in plain language; get back the figure and the nilearn code that produced it."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "neurochat contributors" }]
keywords = ["neuroimaging", "nifti", "nilearn", "mcp", "llm", "mri", "pet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "nibabel>=5.0",
    "nilearn>=0.10",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
    "mcp>=1.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
neurochat = "neurochat.cli:main"
neurochat-mcp = "neurochat.server_mcp:main"

[project.urls]
Homepage = "https://github.com/neurochat/neurochat"

[tool.hatch.build.targets.wheel]
packages = ["src/neurochat"]

[tool.hatch.build.targets.wheel.force-include]
"sample_data" = "neurochat/_sample_data"
"web" = "neurochat/_web"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires downloading an atlas (skipped when offline)",
]
filterwarnings = ["ignore::DeprecationWarning"]
